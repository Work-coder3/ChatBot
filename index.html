<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Windows Server Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0e1a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 680px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: #111827;
      border-radius: 16px;
      border: 1px solid #1e3a5f;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 120, 255, 0.08);
    }

    .chat-header {
      background: linear-gradient(135deg, #0f2444 0%, #0a1628 100%);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #1e3a5f;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      background: #0078d4;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .header-text h1 { font-size: 16px; font-weight: 600; color: #e2e8f0; }
    .header-text p  { font-size: 12px; color: #60a5fa; margin-top: 2px; }

    .status-dot {
      width: 8px; height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-left: auto;
      box-shadow: 0 0 6px #22c55e;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 4px; }

    .message {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .message { animation: none; }
      #chat-box { scroll-behavior: auto; }
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }

    .message.bot .avatar  { background: #0f2444; border: 1px solid #1e3a5f; }
    .message.user .avatar { background: #1e3a5f; }

    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.bot .bubble {
      background: #0f1f35;
      border: 1px solid #1e3a5f;
      color: #cbd5e1;
      border-top-left-radius: 4px;
    }

    .message.user .bubble {
      background: #0078d4;
      color: #fff;
      border-top-right-radius: 4px;
    }

    .typing .bubble { color: #60a5fa; font-style: italic; }

    .notice {
      align-self: center;
      font-size: 12px;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 8px;
      padding: 6px 12px;
    }

    /* Suggestions */
    .suggestions {
      padding: 10px 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .suggestion-btn {
      background: #0f1f35;
      border: 1px solid #1e3a5f;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      text-align: left;
    }

    .suggestion-btn:hover {
      background: #0f2444;
      border-color: #0078d4;
      color: #60a5fa;
    }

    .input-area {
      padding: 16px 20px 8px;
      background: #0a0e1a;
      border-top: 1px solid #1e3a5f;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .privacy-note {
      background: #0a0e1a;
      padding: 0 20px 12px;
      font-size: 11px;
      color: #64748b;
    }

    #user-input {
      flex: 1;
      background: #0f1f35;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    #user-input:focus { border-color: #0078d4; }
    #user-input::placeholder { color: #475569; }

    #send-btn {
      background: #0078d4;
      border: none;
      border-radius: 10px;
      width: 42px; height: 42px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    #send-btn:hover { background: #0065b3; }
    #send-btn:disabled { background: #1e3a5f; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; fill: white; }

    button:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
  </style>
</head>
<body>

<div class="chat-container">

  <div class="chat-header">
    <div class="header-icon">🖥️</div>
    <div class="header-text">
      <h1>Windows Server Assistant</h1>
      <p>ช่วยแก้ปัญหา Server ทุกประเภท</p>
    </div>
    <div class="status-dot"></div>
  </div>

  <div id="chat-box">
    <div class="message bot">
      <div class="avatar">🖥️</div>
      <div class="bubble">สวัสดีครับ! ผมช่วยแก้ปัญหา Windows Server ได้เลย
เลือกหมวดหมู่ด้านล่าง หรือพิมพ์อธิบายปัญหาได้เลยครับ 👇</div>
    </div>
  </div>

  <!-- Quick suggestions -->
  <div class="suggestions" id="suggestions"></div>

  <div class="input-area">
    <input id="user-input" type="text" maxlength="4000" placeholder="อธิบายปัญหา Server ของคุณ..." aria-label="พิมพ์คำถาม" />
    <button id="send-btn" aria-label="ส่งข้อความ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
  <div class="privacy-note">ห้ามพิมพ์รหัสผ่าน ข้อมูลลูกค้า หรือข้อมูลลับขององค์กร · คำตอบจาก AI ควรตรวจสอบก่อนใช้กับเครื่องจริง</div>

</div>

<script>
  const API_URL = "https://chatbot-api.workgame098.workers.dev"
  const MAX_HISTORY = 20

  const suggestions = [
    "วิธีอัปเดต Windows 11",
    "อัปเดตค้างอยู่ทำไง",
    "อัปเดตแล้วเครื่องช้าลง"
  ]

  // เก็บบทสนทนาเพื่อให้บอทจำเรื่องที่คุยก่อนหน้าได้
  let history = []
  let busy = false
  let msgCounter = 0

  const chatBox = document.getElementById("chat-box")
  const userInput = document.getElementById("user-input")
  const sendBtn = document.getElementById("send-btn")

  function renderSuggestions() {
    const container = document.getElementById("suggestions")
    container.textContent = ""
    suggestions.forEach(s => {
      const btn = document.createElement("button")
      btn.className = "suggestion-btn"
      btn.textContent = s
      btn.addEventListener("click", () => {
        userInput.value = s
        sendMessage()
      })
      container.appendChild(btn)
    })
  }

  // ใช้ textContent เสมอ ป้องกันการแทรกโค้ด HTML/JavaScript (XSS)
  function addMessage(text, type) {
    const id = "msg-" + (++msgCounter)
    const isUser = type.includes("user")
    const isTyping = type.includes("typing")

    const div = document.createElement("div")
    div.className = "message " + (isUser ? "user" : "bot") + (isTyping ? " typing" : "")
    div.id = id

    const avatar = document.createElement("div")
    avatar.className = "avatar"
    avatar.textContent = isUser ? "👤" : "🖥️"

    const bubble = document.createElement("div")
    bubble.className = "bubble"
    bubble.textContent = text

    div.append(avatar, bubble)
    chatBox.appendChild(div)
    chatBox.scrollTop = chatBox.scrollHeight
    return id
  }

  function addNotice(text) {
    const div = document.createElement("div")
    div.className = "notice"
    div.textContent = text
    chatBox.appendChild(div)
    chatBox.scrollTop = chatBox.scrollHeight
  }

  function errorText(status) {
    if (status === 429) return "ตอนนี้มีผู้ใช้งานเยอะ กรุณารอสักครู่แล้วลองใหม่ครับ"
    if (status === 403) return "ไม่สามารถเชื่อมต่อได้จากหน้านี้ กรุณาแจ้งทีม IS ครับ"
    return "เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง หากยังไม่ได้ให้แจ้งทีม IS ครับ"
  }

  async function sendMessage() {
    const question = userInput.value.trim()
    if (question === "" || busy) return

    busy = true
    sendBtn.disabled = true

    addMessage(question, "user")
    userInput.value = ""
    history.push({ role: "user", content: question })
    history = history.slice(-MAX_HISTORY)

    const typingId = addMessage("กำลังวิเคราะห์ปัญหา...", "bot typing")

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      })

      const data = await response.json().catch(() => ({}))
      document.getElementById(typingId)?.remove()

      const reply = data.choices?.[0]?.message?.content
      if (!response.ok || !reply) {
        history.pop() // เอาคำถามที่ไม่ได้คำตอบออก จะได้ถามใหม่ได้
        addMessage(errorText(response.status), "bot")
        return
      }

      if (data.redacted) {
        addNotice("ระบบปิดบังข้อมูลที่ดูเหมือนรหัสผ่านหรือข้อมูลลับก่อนส่งแล้ว กรุณาอย่าใส่ข้อมูลเหล่านี้ในแชท")
      }

      addMessage(reply, "bot")
      history.push({ role: "assistant", content: reply })

    } catch (err) {
      document.getElementById(typingId)?.remove()
      history.pop()
      addMessage(errorText(0), "bot")
    } finally {
      busy = false
      sendBtn.disabled = false
      userInput.focus()
    }
  }

  sendBtn.addEventListener("click", sendMessage)
  userInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.isComposing) sendMessage()
  })

  renderSuggestions()
</script>

</body>
</html>
