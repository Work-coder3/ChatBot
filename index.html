<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Windows Server Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0e1a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 680px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: #111827;
      border-radius: 16px;
      border: 1px solid #1e3a5f;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 120, 255, 0.08);
    }

    .chat-header {
      background: linear-gradient(135deg, #0f2444 0%, #0a1628 100%);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #1e3a5f;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      background: #0078d4;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .header-text h1 { font-size: 16px; font-weight: 600; color: #e2e8f0; }
    .header-text p  { font-size: 12px; color: #60a5fa; margin-top: 2px; }

    .status-dot {
      width: 8px; height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-left: auto;
      box-shadow: 0 0 6px #22c55e;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 4px; }

    .message {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }

    .message.bot .avatar  { background: #0f2444; border: 1px solid #1e3a5f; }
    .message.user .avatar { background: #1e3a5f; }

    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .message.bot .bubble {
      background: #0f1f35;
      border: 1px solid #1e3a5f;
      color: #cbd5e1;
      border-top-left-radius: 4px;
    }

    .message.user .bubble {
      background: #0078d4;
      color: #fff;
      border-top-right-radius: 4px;
    }

    .typing .bubble { color: #60a5fa; font-style: italic; }

    /* Category tabs */
    .categories {
      padding: 10px 20px 4px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid #1e3a5f;
    }

    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: transparent;
      border: 1px solid #1e3a5f;
      color: #60a5fa;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: all 0.15s;
    }

    .cat-btn:hover, .cat-btn.active {
      background: #0078d4;
      border-color: #0078d4;
      color: #fff;
    }

    /* Suggestions */
    .suggestions {
      padding: 10px 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .suggestion-btn {
      background: #0f1f35;
      border: 1px solid #1e3a5f;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      text-align: left;
    }

    .suggestion-btn:hover {
      background: #0f2444;
      border-color: #0078d4;
      color: #60a5fa;
    }

    .input-area {
      padding: 16px 20px;
      background: #0a0e1a;
      border-top: 1px solid #1e3a5f;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #user-input {
      flex: 1;
      background: #0f1f35;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    #user-input:focus { border-color: #0078d4; }
    #user-input::placeholder { color: #475569; }

    #send-btn {
      background: #0078d4;
      border: none;
      border-radius: 10px;
      width: 42px; height: 42px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    #send-btn:hover { background: #0065b3; }
    #send-btn svg { width: 18px; height: 18px; fill: white; }
  </style>
</head>
<body>

<div class="chat-container">

  <div class="chat-header">
    <div class="header-icon">🖥️</div>
    <div class="header-text">
      <h1>Windows Server Assistant</h1>
      <p>ช่วยแก้ปัญหา Server ทุกประเภท</p>
    </div>
    <div class="status-dot"></div>
  </div>

  <div id="chat-box">
    <div class="message bot">
      <div class="avatar">🖥️</div>
      <div class="bubble">สวัสดีครับ! ผมช่วยแก้ปัญหา Windows Server ได้เลย
เลือกหมวดหมู่ด้านล่าง หรือพิมพ์อธิบายปัญหาได้เลยครับ 👇</div>
    </div>
  </div>

  <!-- Quick suggestions -->
  <div class="suggestions" id="suggestions"></div>

  <div class="input-area">
    <input id="user-input" type="text" placeholder="อธิบายปัญหา Server ของคุณ..." />
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>

</div>

<script>

const SYSTEM_PROMPT = `คุณคือ IT Assistant ประจำองค์กร ช่วยแก้ปัญหาคอมพิวเตอร์และ Windows ให้ User ทั่วไป
ตอบภาษาไทย กระชับ เข้าใจง่าย ไม่ใช้ศัพท์เทคนิคมากเกินไป
ถ้ามีขั้นตอนให้เรียงเป็นข้อ

สิ่งที่ช่วยได้:
- อัปเดต Windows และแก้ปัญหาการอัปเดต
- คอมช้า ค้าง หรือเปิดไม่ติด
- Wi-Fi หรือ internet ใช้ไม่ได้
- Printer ไม่ทำงาน
- ลืมรหัสผ่าน Windows
- โปรแกรมทั่วไปเปิดไม่ได้หรือ error
- ไฟล์หาย ลบไปแล้วกู้คืน
- ไวรัสหรือโปรแกรมแปลกๆ
- คำถามทั่วไปเกี่ยวกับการใช้งาน Windows

ถ้าไม่สามารถช่วยได้หรือปัญหาซับซ้อนเกินไป ให้ตอบว่า:
"เรื่องนี้เกินขอบเขตที่ผมช่วยได้ครับ แนะนำให้ติดต่อทีม IS โดยตรงได้เลยนะครับ"`

  const suggestionMap = {
    all: [
      "วิธีอัปเดต Windows 11",
      "อัปเดตค้างอยู่ทำไง",
      "อัปเดตแล้วเครื่องช้าลง"
    ]
  }

  function setCategory(cat, btn) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    renderSuggestions(cat)
  }

  function renderSuggestions(cat) {
    let container = document.getElementById("suggestions")
    let items = suggestionMap[cat] || suggestionMap.all
    container.innerHTML = items.map(s =>
      `<button class="suggestion-btn" onclick="askSuggestion('${s}')">${s}</button>`
    ).join("")
  }

  async function sendMessage() {
    let userInput = document.getElementById("user-input")
    let question = userInput.value.trim()
    if (question === "") return

    addMessage(question, "user")
    userInput.value = ""

    let typingId = addMessage("กำลังวิเคราะห์ปัญหา...", "bot typing")

    let response = await fetch(
  "https://chatbot-api.workgame098.workers.dev",
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      messages: [
        { role: "system", content: SYSTEM_PROMPT },
        { role: "user", content: question }
      ]
    })
  }
)

    let data = await response.json()
    let typingEl = document.getElementById(typingId)
    if (typingEl) typingEl.remove()

    if (!data.choices) {
      addMessage("ขออภัยครับ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง", "bot")
      return
    }

    addMessage(data.choices[0].message.content, "bot")
  }

  function addMessage(text, type) {
    let chatBox = document.getElementById("chat-box")
    let id = "msg-" + Date.now()
    let isUser = type.includes("user")
    let isTyping = type.includes("typing")

    let div = document.createElement("div")
    div.className = "message " + (isUser ? "user" : "bot") + (isTyping ? " typing" : "")
    div.id = id
    div.innerHTML = `
      <div class="avatar">${isUser ? "👤" : "🖥️"}</div>
      <div class="bubble">${text}</div>
    `
    chatBox.appendChild(div)
    chatBox.scrollTop = chatBox.scrollHeight
    return id
  }

  function askSuggestion(text) {
    document.getElementById("user-input").value = text
    sendMessage()
  }

  document.getElementById("user-input").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage()
  })

  // โหลด suggestions เริ่มต้น
  renderSuggestions("all")
</script>

</body>
</html>
